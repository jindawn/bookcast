# Copy to bookcast.toml, then enable only the providers you intend to use.
# No API keys here: api_key_env refers to an environment variable name.
schema_version = 1
llm_priority = ["primary", "secondary", "tertiary"]
tts_priority = ["mock-tts"]
failover_on = ["rate_limit", "quota_exhausted", "temporary_unavailable", "timeout"]

[[providers]]
name = "primary"
kind = "llm"
type = "mock"
model = "mock-llm-v1"

[[providers]]
name = "secondary"
kind = "llm"
type = "mock"
model = "mock-llm-v1"

[[providers]]
name = "tertiary"
kind = "llm"
type = "mock"
model = "mock-llm-v1"

[[providers]]
name = "mock-tts"
kind = "tts"
type = "mock"
model = "mock-tones-v1"

# Compatible HTTP service example (replace fields; add its name to llm_priority):
# [[providers]]
# name = "my-server"
# kind = "llm"
# type = "openai-compatible"
# model = "your-model-id"
# base_url = "https://your-provider.example/v1"
# api_key_env = "BOOKCAST_PRIMARY_API_KEY"
# timeout_seconds = 30

# Local server uses type="local", e.g. base_url="http://localhost:11434/v1".
# The server/model must already be installed; BookCast does not download models.
