[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bookcast"
version = "0.1.0"
description = "Local ebooks to resumable Chinese podcasts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.15,<1",
  "pydantic>=2.10,<3",
  "ebooklib>=0.19,<1",
  "beautifulsoup4>=4.12,<5",
  "PyMuPDF>=1.25,<2",
]

[project.scripts]
bookcast = "bookcast.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
tts = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy>=1.26,<3"]
qwen = ["qwen-tts==0.1.1", "torch==2.11.0", "torchaudio==2.11.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bookcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live_llm: explicit environment opt-in required; may call a paid LLM API"]
